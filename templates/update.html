{% extends "base.html" %}
{% block ttitle %} Update Todo {% endblock %}

{% block content %}
<div class="container my-5">
    <h1> Update ToDo </h1>
    <form method = 'POST'>
        <div class="mb-3">
          <label for="exampleInputEmail1" class="form-label">Title</label>
          <input type="text" class="form-control" name= "title" id="exampleInputEmail1"value = "{{todo.title}}  " aria-describedby="emailHelp">
        </div>
        <div class="mb-3">
          <label for="exampleInputPassword1" class="form-label">Description</label>
          <input type="text" class="form-control"name = "description"value = "{{todo.description}}" id="exampleInputPassword1">
        </div>    
        <button type="submit" class="btn btn-primary">Submit</button>
    </form>
</div>


{% endblock %}
